name: Build Python Kivy APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        df -h

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev
        pip install --upgrade pip setuptools
        pip install "cython<3.0.0" buildozer

    - name: Generate buildozer.spec if missing
      run: |
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi

    - name: Fix buildozer.spec
      run: |
        sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        sed -i 's/# android.api = 30/android.api = 33/' buildozer.spec
        sed -i 's/# android.minapi = 21/android.minapi = 21/' buildozer.spec
        sed -i 's/# android.ndk = 23b/android.ndk = 23b/' buildozer.spec
        
        # Fix requirements if needed
        if grep -q "requirements = python3,kivy" buildozer.spec; then
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy==2.1.0/' buildozer.spec
        fi

    - name: Build APK with Buildozer
      run: |
        # Clean buildozer cache
        rm -rf ~/.buildozer
        # Build with timeout
        buildozer -v android debug --timeout 60

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Calculator-APK
        path: |
          bin/*.apk
